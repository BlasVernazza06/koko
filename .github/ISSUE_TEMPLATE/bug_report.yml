name: 🐛 Bug Report
description: Reporta un error o comportamiento inesperado en Koko
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar este problema. Asegúrate de verificar que el error no haya sido reportado previamente.
  - type: input
    id: version
    attributes:
      label: Versión de Koko / Entorno
      description: ¿Qué versión de Koko CLI o navegador estás usando?
      placeholder: "ej. Koko v0.0.1 / Node v22.12.0 / Chrome 128"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Una explicación clara y concisa de lo que está fallando.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Pasos exactos para recrear el error.
      value: |
        1. Ejecutar comando '...'
        2. Seleccionar opción '...'
        3. Ver error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué debería haber ocurrido?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o Capturas de pantalla
      description: Pega aquí la salida de la terminal o errores de consola.
      render: shell
