name: CI Pipeline - Quality, Testing & Build Integrity Gate

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build-gate:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22 with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (Strict Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Static Type Check (Astro & TypeScript)
        run: pnpm run typecheck

      - name: Run Full Test Suite (Vitest & Integrity Gates)
        run: pnpm run test

      - name: Verify Production Build & Sitemap Generation
        run: pnpm run build
        env:
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
